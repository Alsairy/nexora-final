version: '3.8'

services:
  # Backend API
  nexora-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:80"
      - "5001:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:443;http://+:80
      - ASPNETCORE_Kestrel__Certificates__Default__Password=password
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - REDIS_CONNECTION_STRING=redis:6379,password=redis123,ssl=False,abortConnect=False
      - JWT_SECRET=your-256-bit-secret-key-for-jwt-token-generation-minimum-32-characters
      - FIELD_ENCRYPTION_KEY=your-base64-encoded-32-byte-encryption-key
      - FIELD_ENCRYPTION_IV=your-base64-encoded-16-byte-initialization-vector
      - ADMIN_PASSWORD=Admin123!
      - KEY_VAULT_NAME=nexora-keyvault
      - CURRENT_KEY_ID=current-key-id
      - PREVIOUS_KEY_ID_1=previous-key-id-1
      - PREVIOUS_KEY_ID_2=previous-key-id-2
      - OPENAI_API_KEY=your-openai-api-key
    depends_on:
      - postgres
      - redis
    volumes:
      - ~/.aspnet/https:/https:ro
    networks:
      - nexora-network

  # Frontend
  nexora-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=https://localhost:5001
    depends_on:
      - nexora-api
    networks:
      - nexora-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=NexoraDb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - nexora-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass redis123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nexora-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - nexora-api
      - nexora-frontend
    networks:
      - nexora-network

volumes:
  postgres_data:
  redis_data:

networks:
  nexora-network:
    driver: bridge
