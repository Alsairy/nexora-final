input {
  beats {
    port => 5044
  }
  
  tcp {
    port => 5000
    codec => json_lines
  }
  
  udp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if [fields][service] == "nexora-api" {
    mutate {
      add_field => { "service_name" => "nexora-api" }
    }
    
    if [message] =~ /HTTP/ {
      grok {
        match => { "message" => "HTTP %{WORD:http_method} %{URIPATH:http_path} responded %{INT:http_status:int} in %{NUMBER:response_time:float} ms" }
      }
      
      mutate {
        add_field => { "log_type" => "http_request" }
      }
    }
  }
  
  date {
    match => [ "@timestamp", "ISO8601" ]
  }
  
  mutate {
    remove_field => [ "host", "agent", "ecs", "input" ]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "nexora-logs-%{+YYYY.MM.dd}"
    template_name => "nexora-logs"
    template_pattern => "nexora-logs-*"
    template => {
      "index_patterns" => ["nexora-logs-*"],
      "settings" => {
        "number_of_shards" => 1,
        "number_of_replicas" => 0
      },
      "mappings" => {
        "properties" => {
          "@timestamp" => { "type" => "date" },
          "level" => { "type" => "keyword" },
          "message" => { "type" => "text" },
          "service_name" => { "type" => "keyword" },
          "log_type" => { "type" => "keyword" },
          "http_method" => { "type" => "keyword" },
          "http_path" => { "type" => "keyword" },
          "http_status" => { "type" => "integer" },
          "response_time" => { "type" => "float" }
        }
      }
    }
  }
  
  stdout {
    codec => rubydebug
  }
}
