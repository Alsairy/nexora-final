global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@nexora.com'
  smtp_auth_username: '${SMTP_USER}'
  smtp_auth_password: '${SMTP_PASSWORD}'

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'web.hook'
  routes:
  - match:
      severity: critical
    receiver: 'critical-alerts'
  - match:
      severity: warning
    receiver: 'warning-alerts'

receivers:
- name: 'web.hook'
  webhook_configs:
  - url: 'http://localhost:5001/webhook'

- name: 'critical-alerts'
  email_configs:
  - to: 'admin@nexora.com'
    subject: 'CRITICAL: Nexora Platform Alert'
    body: |
      Alert: {{ .GroupLabels.alertname }}
      Summary: {{ .CommonAnnotations.summary }}
      Description: {{ .CommonAnnotations.description }}
      
      Details:
      {{ range .Alerts }}
      - Alert: {{ .Annotations.summary }}
        Value: {{ .Annotations.value }}
        Time: {{ .StartsAt }}
      {{ end }}
  
  slack_configs:
  - api_url: '${SLACK_WEBHOOK_URL}'
    channel: '#alerts-critical'
    title: 'CRITICAL: Nexora Platform Alert'
    text: |
      Alert: {{ .GroupLabels.alertname }}
      {{ range .Alerts }}
      Summary: {{ .Annotations.summary }}
      {{ end }}

- name: 'warning-alerts'
  email_configs:
  - to: 'devops@nexora.com'
    subject: 'WARNING: Nexora Platform Alert'
    body: |
      Alert: {{ .GroupLabels.alertname }}
      Summary: {{ .CommonAnnotations.summary }}
      Description: {{ .CommonAnnotations.description }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'dev', 'instance']
